def isNewArchitectureEnabled() {
  return rootProject.hasProperty("newArchEnabled") && rootProject.getProperty("newArchEnabled") == "true"
}

apply plugin: "com.android.library"
apply plugin: "kotlin-android"

if (isNewArchitectureEnabled()) {
  apply plugin: "com.facebook.react"
}

def getExtOrDefault(name) {
  return rootProject.ext.has(name) ? rootProject.ext.get(name) : project.properties["LivenessLibrary_" + name]
}

def getExtOrIntegerDefault(name) {
  return rootProject.ext.has(name) ? rootProject.ext.get(name) : (project.properties["LivenessLibrary_" + name]).toInteger()
}

def supportsNamespace() {
  def parsed = com.android.Version.ANDROID_GRADLE_PLUGIN_VERSION.tokenize('.')
  def major = parsed[0].toInteger()
  def minor = parsed[1].toInteger()

  // Namespace support was added in 7.3.0
  return (major == 7 && minor >= 3) || major >= 8
}

android {
  if (supportsNamespace()) {
    namespace "com.livenessrnlibrary"

    sourceSets {
      main {
        manifest.srcFile "src/main/AndroidManifest.xml"
      }
    }
  }

  compileSdkVersion getExtOrIntegerDefault("compileSdkVersion")

  defaultConfig {
    minSdkVersion getExtOrIntegerDefault("minSdkVersion")
    targetSdkVersion getExtOrIntegerDefault("targetSdkVersion")
    versionCode 1
    versionName "1.0.0"
    buildConfigField "boolean", "IS_NEW_ARCHITECTURE_ENABLED", isNewArchitectureEnabled().toString()
  }

  buildTypes {
    release {
      minifyEnabled false
    }
  }

  lintOptions {
    disable "GradleCompatible"
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_1_8
    targetCompatibility JavaVersion.VERSION_1_8
  }

  sourceSets {
    main {
      if (isNewArchitectureEnabled()) {
        java.srcDirs += ['src/newarch/java']
      } else {
        java.srcDirs += ['src/oldarch/java']
      }
    }
  }

  // Android App Bundle specific configurations
  aaptOptions {
    noCompress "tflite"
  }
}

repositories {
  mavenCentral()
  google()

  def found = false
  def defaultDir = null
  def androidSourcesName = 'React Native sources'

  if (rootProject.ext.has('reactNativeAndroidRoot')) {
    defaultDir = rootProject.ext.get('reactNativeAndroidRoot')
  } else {
    defaultDir = new File(
            projectDir,
            '/../../../node_modules/react-native/android'
    )
  }

  if (defaultDir.exists()) {
    maven {
      url defaultDir.toString()
      name androidSourcesName
    }

    logger.info(":${project.name}:reactNativeAndroidRoot ${defaultDir.canonicalPath}")
    found = true
  } else {
    def parentDir = rootProject.projectDir

    1.upto(5, {
      if (found) return true
      parentDir = parentDir.parentFile

      def androidSourcesDir = new File(
              parentDir,
              'node_modules/react-native'
      )

      def androidPrebuiltBinaryDir = new File(
              parentDir,
              'node_modules/react-native/android'
      )

      if (androidPrebuiltBinaryDir.exists()) {
        maven {
          url androidPrebuiltBinaryDir.toString()
          name androidSourcesName
        }

        logger.info(":${project.name}:reactNativeAndroidRoot ${androidPrebuiltBinaryDir.canonicalPath}")
        found = true
      } else if (androidSourcesDir.exists()) {
        maven {
          url androidSourcesDir.toString()
          name androidSourcesName
        }

        logger.info(":${project.name}:reactNativeAndroidRoot ${androidSourcesDir.canonicalPath}")
        found = true
      }
    })
  }

  if (!found) {
    throw new GradleException(
            "${project.name}: unable to locate React Native android sources. " +
                    "Ensure you have you installed React Native as a dependency in your project and try again."
    )
  }
}

def kotlin_version = getExtOrDefault('kotlinVersion') ?: '1.8.10'

dependencies {
  // For < 0.71, this will be from the local maven repo
  // For >= 0.71, this will be replaced by `com.facebook.react:react-android:$version` by react gradle plugin
  //noinspection GradleDynamicVersion
  implementation 'com.facebook.react:react-native:+'
  implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"

  // Udentify Face SDK dependencies (native AAR provided by host app)
  compileOnly files('libs/face-26.3.0814.aar')

  // Udentify Commons dependency - provided by udentify-core module
  api project(':udentify-core')

  // Face recognition ecosystem dependencies — host app must provide these
  // as `implementation` to prevent version conflicts with other libraries.
  // See README.md → "Required Host App Dependencies" for the full list.
  //
  // okhttp pinned to 4.9.2 to match React Native 0.77+'s strictly-constrained
  // transitive version (consistent resolution requires compile == runtime).
  compileOnly 'com.squareup.okhttp3:okhttp:4.9.2'
  compileOnly 'com.squareup.okhttp3:okhttp-tls:4.9.2'
  compileOnly 'com.otaliastudios:cameraview:2.7.2'
  compileOnly 'com.google.android.material:material:1.9.0'
  compileOnly 'com.google.code.gson:gson:2.10.1'
  compileOnly 'com.google.android.gms:play-services-mlkit-face-detection:17.1.0'
  compileOnly 'org.tensorflow:tensorflow-lite:2.13.0'
  compileOnly 'org.tensorflow:tensorflow-lite-gpu:2.13.0'
  compileOnly 'org.tensorflow:tensorflow-lite-support:0.4.4'
  compileOnly 'com.airbnb.android:lottie:6.1.0'

  // Android Support — host app must provide these (typically already present in RN projects)
  compileOnly 'androidx.core:core-ktx:1.10.1'
  compileOnly 'androidx.appcompat:appcompat:1.6.1'
  compileOnly 'androidx.fragment:fragment-ktx:1.6.1'
  compileOnly 'androidx.activity:activity-ktx:1.7.2'
}

if (isNewArchitectureEnabled()) {
  react {
    jsRootDir = file("../src/")
    libraryName = "LivenessLibrary"
    codegenJavaPackageName = "com.livenessrnlibrary"
  }
}
